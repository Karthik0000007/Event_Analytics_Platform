# Serves the built dashboard and forwards API calls to the Go service.
# The browser only talks to this server, so no CORS setup is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve "api" with Docker's DNS at request time, so nginx still starts
    # (and recovers) if the api container is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /v1/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /healthz {
        proxy_pass $api_upstream;
    }

    location = /readyz {
        proxy_pass $api_upstream;
    }

    # Hashed build files never change, so browsers can cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (like /dlq) load index.html,
    # and React Router shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
